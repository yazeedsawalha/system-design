<text x="680.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">probe fail</text>
<text x="80" y="384" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">Pair with timeouts, bulkheads, retries with jitter · prevent retry storms</text>
