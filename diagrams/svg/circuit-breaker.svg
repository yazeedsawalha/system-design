<text x="510.0" y="249.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">fail fast</text>
<text x="510.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">cooldown</text>
