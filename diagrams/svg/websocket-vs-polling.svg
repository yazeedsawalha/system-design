<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620"
     viewBox="0 0 1100 620" role="img" aria-label="WebSocket vs SSE vs Polling">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="36" y="36" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">WebSocket vs SSE vs Polling</text>
<text x="36" y="56" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">System Design Interview Guide</text>
<rect x="40" y="80" width="340" height="260" rx="12" ry="12" fill="#FCE8E6" fill-opacity="0.35" stroke="#D93025" stroke-width="2" stroke-dasharray="8 5"/>
<text x="56" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#D93025">Without a live channel</text>
<rect x="70" y="140" width="90" height="50" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="115.0" y="169.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Client</text>
<rect x="210" y="140" width="100" height="50" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="260.0" y="169.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Server</text>
<path d="M 160,165.0 L 210,165.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="185.0" y="159.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">poll… poll…</text>
<text x="210" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#D93025">Many empty requests · simple but wasteful</text>
<rect x="400" y="80" width="660" height="260" rx="12" ry="12" fill="#E6F4EA" fill-opacity="0.35" stroke="#34A853" stroke-width="2" stroke-dasharray="8 5"/>
<text x="416" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#34A853">With long-lived stream</text>
<rect x="430" y="130" width="90" height="50" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="475.0" y="159.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Client</text>
<rect x="580" y="130" width="100" height="50" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="630.0" y="159.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Server</text>
<path d="M 520,155.0 L 580,155.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">SSE ↓ one-way</text>
<rect x="730" y="200" width="90" height="50" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="775.0" y="229.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Client</text>
<rect x="880" y="200" width="100" height="50" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="930.0" y="229.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Server</text>
<path d="M 820,225.0 L 880,225.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="850.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">WS ↔ chat</text>
<text x="730" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#34A853">Server pushes when something happens · fewer wasted calls</text>
<text x="40" y="404" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">Pick by direction (one-way vs two-way), proxies/firewalls, and reconnect story</text>
<rect x="36" y="550" width="250" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="46" y="564" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F6368">Legend</text>
<rect x="48" y="574" width="16" height="16" rx="4" ry="4" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="70" y="587" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Client</text>
<rect x="163" y="574" width="16" height="16" rx="4" ry="4" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="185" y="587" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Compute</text>
</svg>
