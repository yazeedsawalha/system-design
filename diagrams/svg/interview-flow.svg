<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560"
     viewBox="0 0 1100 560" role="img" aria-label="Interview Flow: Clarify → HLD">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="36" y="36" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">Interview Flow: Clarify → HLD</text>
<text x="36" y="56" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">System Design Interview Guide</text>
<rect x="40" y="180" width="200" height="100" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="140.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">1. Clarify</text>
<text x="140.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">5–8 min</text>
<text x="140.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">users · scale · NFRs</text>
<rect x="280" y="180" width="200" height="100" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="380.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">2. Capacity</text>
<text x="380.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">5 min</text>
<text x="380.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">QPS · storage · BW</text>
<rect x="520" y="180" width="200" height="100" rx="10" ry="10" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="620.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">3. High-level</text>
<text x="620.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">10–15 min</text>
<text x="620.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">boxes + APIs</text>
<rect x="760" y="180" width="200" height="100" rx="10" ry="10" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
<text x="860.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">4. Deep dive</text>
<text x="860.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">10 min</text>
<text x="860.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">tradeoffs · SLO</text>
<path d="M 240,230.0 L 280,230.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 480,230.0 L 520,230.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 720,230.0 L 760,230.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="354" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">Speak while drawing · check in after each step · NFRs top-right · never invent requirements — ask</text>
<rect x="36" y="490" width="480" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="46" y="504" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F6368">Legend</text>
<rect x="48" y="514" width="16" height="16" rx="4" ry="4" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="70" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Clarify</text>
<rect x="163" y="514" width="16" height="16" rx="4" ry="4" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="185" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Capacity</text>
<rect x="278" y="514" width="16" height="16" rx="4" ry="4" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="300" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">HLD</text>
<rect x="393" y="514" width="16" height="16" rx="4" ry="4" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
<text x="415" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Deep dive</text>
</svg>
