      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="36" y="36" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">Vertical vs Horizontal Scaling</text>
<text x="36" y="56" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">System Design Interview Guide</text>
<rect x="40" y="80" width="500" height="360" rx="12" ry="12" fill="#FCE8E6" fill-opacity="0.35" stroke="#D93025" stroke-width="2" stroke-dasharray="8 5"/>
<text x="56" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#D93025">Without horizontal scale (scale up)</text>
<rect x="70" y="200" width="100" height="56" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="120.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Users</text>
<rect x="250" y="160" width="160" height="100" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="330.0" y="207.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">One bigger</text>
<text x="330.0" y="221.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">machine</text>
<path d="M 170,228.0 L 210.0,228.0 L 210.0,210.0 L 250,210.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">all traffic</text>
<text x="290" y="410" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#D93025">Simple · hits a ceiling · big blast radius</text>
<rect x="560" y="80" width="500" height="360" rx="12" ry="12" fill="#E6F4EA" fill-opacity="0.35" stroke="#34A853" stroke-width="2" stroke-dasharray="8 5"/>
<text x="576" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#34A853">With horizontal scale (scale out)</text>
<rect x="590" y="200" width="100" height="56" rx="10" ry="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="640.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Users</text>
<rect x="720" y="200" width="110" height="56" rx="10" ry="10" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="775.0" y="225.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Load</text>
<text x="775.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">balancer</text>
<rect x="880" y="120" width="100" height="48" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="930.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">App 1</text>
<rect x="880" y="190" width="100" height="48" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="930.0" y="218.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">App 2</text>
<rect x="880" y="260" width="100" height="48" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="930.0" y="288.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">App 3</text>
<path d="M 690,228.0 L 720,228.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 830,228.0 L 855.0,228.0 L 855.0,144.0 L 880,144.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 830,228.0 L 855.0,228.0 L 855.0,214.0 L 880,214.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 830,228.0 L 855.0,228.0 L 855.0,284.0 L 880,284.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="410" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#34A853">Add machines · needs stateless apps + partitioned data</text>
<text x="40" y="494" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">Interviews: name which tier scales which way — web tier out, early DB often up first</text>
<rect x="36" y="530" width="365" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="46" y="544" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F6368">Legend</text>
<rect x="48" y="554" width="16" height="16" rx="4" ry="4" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
<text x="70" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Client</text>
<rect x="163" y="554" width="16" height="16" rx="4" ry="4" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="185" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">LB / new piece</text>
<rect x="278" y="554" width="16" height="16" rx="4" ry="4" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="300" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Compute</text>
