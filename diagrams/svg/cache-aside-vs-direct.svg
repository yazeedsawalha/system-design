<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600"
     viewBox="0 0 1100 600" role="img" aria-label="Without Cache vs Cache-Aside">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
  </defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="36" y="36" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#202124">Without Cache vs Cache-Aside</text>
<text x="36" y="56" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">System Design Interview Guide</text>
<rect x="40" y="80" width="500" height="360" rx="12" ry="12" fill="#FCE8E6" fill-opacity="0.35" stroke="#D93025" stroke-width="2" stroke-dasharray="8 5"/>
<text x="56" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#D93025">Without a cache</text>
<rect x="80" y="200" width="110" height="56" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="135.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">App</text>
<path d="M 280,200 L 280,250 A 70.0,10 0 0 0 420,250 L 420,200 A 70.0,10 0 0 0 280,200 Z" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<ellipse cx="350.0" cy="200" rx="70.0" ry="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<text x="350.0" y="229.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Database</text>
<path d="M 190,228.0 L 280,225.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235.0" y="220.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">every read</text>
<text x="290" y="410" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#D93025">Every request hits the database · slow under load</text>
<rect x="560" y="80" width="500" height="360" rx="12" ry="12" fill="#E6F4EA" fill-opacity="0.35" stroke="#34A853" stroke-width="2" stroke-dasharray="8 5"/>
<text x="576" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#34A853">With cache-aside</text>
<rect x="590" y="200" width="110" height="56" rx="10" ry="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="645.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">App</text>
<rect x="740" y="120" width="130" height="64" rx="10" ry="10" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="805.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Cache</text>
<text x="805.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#202124">(Redis)</text>
<path d="M 740,270 L 740,320 A 70.0,10 0 0 0 880,320 L 880,270 A 70.0,10 0 0 0 740,270 Z" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<ellipse cx="810.0" cy="270" rx="70.0" ry="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<text x="810.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#202124">Database</text>
<path d="M 700,228.0 L 720.0,228.0 L 720.0,152.0 L 740,152.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720.0" y="184.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">1. get</text>
<path d="M 700,228.0 L 720.0,228.0 L 720.0,295.0 L 740,295.0" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720.0" y="255.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F6368">2. miss → load</text>
<text x="810" y="410" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#34A853">Hot keys served from memory · app owns read/write path</text>
<text x="40" y="494" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F6368">Invalidate or TTL on write · watch stampedes on popular keys</text>
<rect x="36" y="530" width="365" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="46" y="544" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#5F6368">Legend</text>
<rect x="48" y="554" width="16" height="16" rx="4" ry="4" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
<text x="70" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Compute</text>
<rect x="163" y="554" width="16" height="16" rx="4" ry="4" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5"/>
<text x="185" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Cache (new)</text>
<rect x="278" y="554" width="16" height="16" rx="4" ry="4" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
<text x="300" y="567" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#202124">Database</text>
</svg>
